<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Seite nicht gefunden — Fragio</title>
<meta name="robots" content="noindex,follow" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<meta name="theme-color" content="#ffffff" />
<link rel="stylesheet" href="/site.css" />
<style>
  .util { min-height: 100svh; display: grid; place-items: center; padding: 40px 24px; text-align: center; }
  .util .inner { max-width: 540px; }
  .util .brand { justify-content: center; margin: 0 0 32px; }
  .util .err-code { font-size: clamp(64px, 14vw, 108px); font-weight: 800; line-height: 1; letter-spacing: -0.04em; color: var(--accent-soft); margin: 0 0 4px; }
  .util .btn-row { justify-content: center; margin-top: 30px; }
</style>
</head>
<body>
  <main class="util">
    <div class="inner">
      <a href="/" class="brand" aria-label="Fragio Startseite">
        <img class="brand-mark" src="/logo-mark.png" width="34" height="34" alt="" />
        <span>Fragio</span>
      </a>
      <p class="err-code" aria-hidden="true">404</p>
      <h1>Diese Seite gibt es nicht.</h1>
      <p class="lead" style="margin:16px auto 0;max-width:420px;text-align:center">Der Link ist vielleicht veraltet oder enthält einen Tippfehler. Von der Startseite aus finden Sie alles Weitere.</p>
      <div class="btn-row">
        <a href="/" class="btn btn-primary">Zur Startseite</a>
        <a href="/kontakt.html" class="btn btn-ghost">Kontakt</a>
      </div>
    </div>
  </main>
</body>
</html>
