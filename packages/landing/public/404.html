<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Seite nicht gefunden — Fragio</title>
<meta name="robots" content="noindex,follow" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="apple-touch-icon" href="/favicon.svg" />
<meta name="theme-color" content="#ffffff" />
<style>
  :root {
    --sand: oklch(0.985 0.003 258); --paper: #fff; --ink: oklch(0.22 0.01 258); --green: oklch(0.55 0.16 258);
    --rust: oklch(0.48 0.15 258); --muted: oklch(0.48 0.01 258); --line: oklch(0.92 0.005 258); --line-2: oklch(0.88 0.006 258);
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--sand); color:var(--ink); font-family:var(--sans); -webkit-font-smoothing:antialiased; }
  * { box-sizing:border-box; }
  a { color:var(--green); }
  .btn { display:inline-block; padding:14px 24px; border-radius:999px; background:var(--green); color:#fff; font-size:16px; font-weight:600; text-decoration:none; }
  .btn:hover { background:var(--rust); color:#fff; }
  .ghost { display:inline-block; padding:14px 22px; border-radius:999px; border:1px solid var(--line-2); color:var(--green); font-size:16px; font-weight:600; text-decoration:none; }
  :focus-visible { outline:2px solid var(--green); outline-offset:2px; border-radius:6px; }
</style>
</head>
<body>
  <main style="max-width:560px;padding:48px 24px;text-align:center">
    <p style="margin:0 0 10px;font-size:14px;letter-spacing:0.14em;text-transform:uppercase;color:var(--green);font-weight:700">Fehler 404</p>
    <h1 style="margin:0 0 14px;font-size:clamp(32px,6vw,48px);line-height:1.1;letter-spacing:-0.02em">Diese Seite gibt es nicht.</h1>
    <p style="margin:0 auto 32px;max-width:420px;font-size:17px;line-height:1.6;color:var(--muted)">Der Link ist vielleicht veraltet oder enthält einen Tippfehler. Von der Startseite aus finden Sie alles Weitere.</p>
    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
      <a href="/" class="btn">Zur Startseite</a>
      <a href="/#kontakt" class="ghost">Kontakt</a>
    </div>
  </main>
</body>
</html>
